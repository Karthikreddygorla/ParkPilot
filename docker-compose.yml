services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql   # runs once, on first start
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: parkpilot
    depends_on:
      db: { condition: service_healthy }
  phpmyadmin:
    image: phpmyadmin:5
    ports: ["8080:80"]
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on: [db]
volumes:
  dbdata:
